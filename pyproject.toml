[build-system]
requires = ["setuptools >=40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 79

[tool.pylint.main]
load-plugins = ["pylint_per_file_ignores"]
ignore-patterns = ["^\\.#", "^.*\\.pyi"]

[tool.pylint.basic]
method-rgx = "^([a-z_][0-9a-z_]{2,}|(visit_|depart_)[0-9A-Za-z_]{2,})$"

[tool.pylint.design]
min-public-methods = 0

[tool.pylint.format]
max-line-length = 79

[tool.pylint."messages control"]
enable = ["useless-suppression"]
# `mypy` does the better job
disable = ["no-member"]
per-file-ignores = [
    # Disable checks on Sphinx configuration options
    "docs/conf.py:invalid-name,redefined-builtin",
    # Sphinx translators are huge by design
    "src/sphinx_abcdoc_theme/writer.py:too-many-lines,too-many-public-methods",
]

[tool.pylint.similarities]
ignore-imports = true
